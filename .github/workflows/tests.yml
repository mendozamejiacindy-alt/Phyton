name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar dependencias
        run: poetry install

      - name: Ejecutar pruebas
        run: poetry run pytest src/actividad_10 -v

      - name: Verificar cobertura
        run: poetry run pytest src/actividad_10 --cov=src/actividad_10 --cov-fail-under=80