repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [python]

      - id: ruff
        name: ruff
        entry: poetry run ruff check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: poetry run mypy src
        language: system
        pass_filenames: false
        types: [python]