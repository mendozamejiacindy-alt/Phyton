[project]
name = "actividad-5"
version = "0.1.0"
description = ""
authors = [
    { name = "Ximena", email = "cindy.mendoza@axity.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "black (>=26.5.1,<27.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
exclude = ["alembic"]
force-exclude = true

[tool.ruff.lint]
ignore = ["I001"]